<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1f3fb8">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<script>try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<title>線上說明會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--bg1:#e8edff;--ink:#0e1830;--mut:#5f6a80;--line:#e3e7f0;--card:#fff;--fld:#fbfcfe;--soft:#f1f4fc;--glass:rgba(255,255,255,.78);
--pri:#1f3fb8;--pri2:#4468f2;--gold:#b88a2c;--gold2:#e8c473;--ok:#0f8a5f;--goldtxt:#946b12;--red:#c0352b;
--navy1:#0e1830;--navy2:#26396b;--orb1:#cfdcff;--orb2:#f8e6bd;--sh:rgba(14,24,48,.16);--dot:rgba(31,63,184,.08);
--tb:#e8eeff;--tg:#dff5ea;--ty:#fbf1d9;--tr:#fde6e3}
:root[data-theme=dark]{--bg:#0a0f1f;--bg1:#141d3f;--ink:#e8ecf8;--mut:#9ba7c4;--line:#232e50;--card:#121a33;--fld:#0d1429;--soft:#19234a;--glass:rgba(18,26,51,.76);
--pri:#8ea6ff;--pri2:#6f8bff;--ok:#3ddc97;--goldtxt:#f0cd7e;--red:#ff8f85;--navy1:#3552d9;--navy2:#5876ff;--orb1:rgba(68,104,242,.38);--orb2:rgba(184,138,44,.28);--sh:rgba(0,0,0,.55);--dot:rgba(142,166,255,.1);
--tb:rgba(111,139,255,.18);--tg:rgba(61,220,151,.14);--ty:rgba(232,196,115,.16);--tr:rgba(255,143,133,.16)}
*{box-sizing:border-box}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--bg1) 0,var(--bg) 480px) no-repeat,var(--bg);font:16px/1.7 Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,196,115,.55)}100%{box-shadow:0 0 0 14px rgba(232,196,115,0)}}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.top>div{max-width:1100px;margin:auto;padding:13px 22px;display:flex;justify-content:space-between;align-items:center}
.brand{font:700 17px "Noto Serif TC",serif;letter-spacing:.04em}
.brand i{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:10px;border-radius:9px;font-style:normal;font-size:12px;color:#3d2c05;background:linear-gradient(135deg,#d6a840,#f1d38b);box-shadow:0 4px 10px -3px rgba(184,138,44,.6)}
.actions{display:flex;gap:8px}
.lnk{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mut);cursor:pointer;font:inherit;font-size:13px;transition:.18s}
.lnk:hover{color:var(--ink);border-color:var(--pri2)}
.wrap{max-width:900px;margin:0 auto;padding:22px 18px 40px}
.wrap.wide{max-width:1100px}
.hero{position:relative;overflow:hidden;background:var(--card);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px;border:1px solid var(--line);border-radius:32px;padding:52px 36px;margin:14px 0 22px;box-shadow:0 34px 70px -30px var(--sh),0 4px 14px rgba(14,24,48,.04);animation:up .6s ease both}
.hero:before{content:"";position:absolute;right:-130px;top:-150px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,var(--orb1) 0,transparent 68%)}
.hero:after{content:"";position:absolute;left:-120px;bottom:-180px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,var(--orb2) 0,transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero h1{font:700 clamp(28px,6vw,48px)/1.2 "Noto Serif TC",serif;margin:18px 0 12px;letter-spacing:.01em;background:linear-gradient(120deg,var(--ink) 35%,var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 0 8px;max-width:560px;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--goldtxt);background:var(--ty);border:1px solid rgba(184,138,44,.25);padding:5px 15px;border-radius:99px}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}
@media(max-width:600px){.steps{grid-template-columns:1fr}.hero{padding:36px 22px}}
.steps span{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;background:var(--glass);border:1px solid var(--line);padding:13px 15px;border-radius:18px;backdrop-filter:blur(8px)}
.steps b{flex:none;display:grid;place-items:center;width:31px;height:31px;border-radius:50%;color:#fff;font-size:13px;background:linear-gradient(135deg,#1b36a6,#4468f2);box-shadow:0 6px 14px -4px rgba(31,63,184,.6)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;margin:16px 0;box-shadow:0 18px 40px -22px var(--sh),0 2px 6px rgba(14,24,48,.03);animation:up .6s ease both}
.card h3{margin:0 0 16px;font:700 19px "Noto Serif TC",serif}
.card h3:before{content:"";display:inline-block;width:4px;height:17px;margin-right:11px;border-radius:3px;vertical-align:-2px;background:linear-gradient(var(--gold),var(--gold2))}
.center{text-align:center}.muted{color:var(--mut)}
label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 7px;color:var(--mut)}
input,select,textarea{font:inherit;width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--fld);color:var(--ink);outline:none;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 4px rgba(68,104,242,.16)}
input[readonly]{background:var(--soft);color:var(--mut)}
textarea{min-height:120px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,#1b36a6,#4468f2);border:0;border-radius:14px;padding:12px 22px;cursor:pointer;text-decoration:none;box-shadow:0 12px 26px -10px rgba(31,63,184,.7);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(31,63,184,.75)}.btn:active{transform:none}.btn:disabled{opacity:.55;transform:none}
.btn.lg{padding:16px 34px;font-size:17px;border-radius:17px}.btn.block{width:100%;margin-top:26px}
.btn.gold{color:#3d2c05;background:linear-gradient(135deg,#d6a840,#f4d98f);box-shadow:0 12px 28px -10px rgba(184,138,44,.8)}
.btn.ghost{background:var(--card);color:var(--pri);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--card);color:var(--red);border:1.5px solid rgba(192,53,43,.3);box-shadow:none}
.btn.sm{padding:8px 15px;font-size:14px;border-radius:11px;box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#14975a,#2bc77f);box-shadow:0 8px 18px -8px rgba(20,151,90,.6)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.seg{grid-template-columns:1fr}}
.opt{position:relative;border:1.5px solid var(--line);border-radius:22px;padding:22px 20px 20px;cursor:pointer;background:var(--card);transition:.2s}
.opt:hover{border-color:var(--pri2);transform:translateY(-2px)}
.opt b{display:block;font-size:17px;margin-bottom:2px}.opt small{color:var(--mut);line-height:1.5;display:block}
.opt.on{border-color:var(--pri2);background:linear-gradient(180deg,var(--soft),var(--card));box-shadow:0 16px 30px -16px rgba(68,104,242,.6)}
.opt.on:after{content:"✓";position:absolute;right:14px;top:14px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri2);color:#fff;font-size:13px}
.days{display:flex;gap:10px;margin:20px 0 14px;overflow-x:auto;padding-bottom:4px}
.day{flex:1;min-width:98px;text-align:center;padding:12px 6px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;background:var(--card);font-weight:700;transition:.18s}
.day small{display:block;font-weight:400;color:var(--mut)}
.day.on{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;border-color:transparent;box-shadow:0 12px 24px -12px var(--sh)}.day.on small{color:#cfd7ee}
.hrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.chip{padding:12px 0;text-align:center;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-weight:600;background:var(--card);transition:.15s;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--pri2);color:var(--pri)}
.chip.on{background:linear-gradient(135deg,#1b36a6,#4468f2);color:#fff;border-color:transparent;box-shadow:0 10px 20px -10px rgba(31,63,184,.8)}
.tips{list-style:none;padding:0;margin:24px 0 30px;display:grid;gap:10px;color:var(--mut)}
.tips li{display:flex;gap:12px;align-items:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:13px 16px}
.tips li:before{content:"✓";flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--tg);color:var(--ok);font-weight:700;font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;width:fit-content;max-width:100%}
.tab{font:inherit;font-weight:600;border:0;background:none;color:var(--mut);padding:9px 20px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:.18s}
.tab.on{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;box-shadow:0 10px 20px -10px var(--sh)}
.mons{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding-bottom:6px}
.mon{flex:none;font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:14px;cursor:pointer;transition:.18s}
.mon small{margin-left:8px;display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--tb);color:var(--pri);font-size:12px;text-align:center}
.mon.on{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;border-color:transparent}.mon.on small{background:rgba(255,255,255,.2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 18px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:20px 10px;text-align:center;box-shadow:0 14px 30px -20px var(--sh);transition:.2s}
.stat.click{cursor:pointer}.stat.click:hover{transform:translateY(-3px);border-color:var(--pri2)}
.stat.on{border-color:var(--pri2);box-shadow:0 18px 34px -18px rgba(68,104,242,.7);background:linear-gradient(180deg,var(--soft),var(--card))}
.stat b{display:block;font:700 34px/1.2 "Noto Serif TC",serif;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.t b{background:linear-gradient(135deg,#d2452f,#f08a3c);-webkit-background-clip:text;background-clip:text}
.stat small{color:var(--mut)}
.alert{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--tr),var(--ty));border:1px solid rgba(192,53,43,.25);color:var(--ink);padding:14px 18px;border-radius:18px;margin:10px 0;animation:up .5s ease both}
.push{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:18px 22px}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold2);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:0 12px 28px -20px var(--sh);animation:up .5s ease both;transition:.2s}
.row:hover{transform:translateY(-2px)}
.row.todo{border-left-color:#e2603a}
.row .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fu{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.fu small{color:var(--mut)}
.fu button{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer;transition:.15s}
.fu button:hover{border-color:var(--pri2)}
.fu button.on{background:linear-gradient(135deg,#1b36a6,#4468f2);color:#fff;border-color:transparent}
.fu button.x{border-style:dashed;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 11px;background:var(--tb);color:var(--pri)}
.tag.g{background:var(--tg);color:var(--ok)}.tag.y{background:var(--ty);color:var(--goldtxt)}.tag.r{background:var(--tr);color:var(--red)}
.fr{display:grid;grid-template-columns:1.3fr 84px 34px 1.3fr 42px;gap:8px;align-items:center;margin-bottom:10px}
.fr input,.fr select{padding:9px 10px;border-radius:11px}
#stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:26px;overflow:hidden;box-shadow:0 44px 80px -30px var(--sh),0 0 0 1px var(--line)}
#stage iframe,#stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#shield{position:absolute;inset:0;z-index:5;background:transparent}
#bar{position:absolute;z-index:9;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:28px 18px 12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:13px;font-variant-numeric:tabular-nums}
.prog{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.28);pointer-events:none;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),#fff)}
#fs,#mu{width:auto;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
#mu{animation:pulse 1.6s infinite}
#stage.pfs{position:fixed;inset:0;z-index:999;border-radius:0;aspect-ratio:auto;width:100vw;height:100dvh}
#stage:fullscreen{border-radius:0;width:100%;height:100%;aspect-ratio:auto}
svg.ch{width:100%;background:var(--soft);border-radius:14px;border:1px solid var(--line)}
.foot{text-align:center;color:var(--mut);opacity:.7;font-size:13px;padding:10px 0 34px}
li{margin:3px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="wrap center muted" style="padding-top:80px">載入中…</div></div>
<script>
const C = window.CONF, BS = 10;
firebase.initializeApp(Object.assign({ messagingSenderId: (C.firebase.appId || '').split(':')[1] }, C.firebase));
const db = firebase.firestore(), auth = firebase.auth(), FV = firebase.firestore.FieldValue;
if (C.emailjs.publicKey) emailjs.init({ publicKey: C.emailjs.publicKey });

const $ = s => document.querySelector(s), P = new URLSearchParams(location.search);
const view = h => { $('#app').innerHTML = h; scrollTo(0, 0); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base = () => location.href.split('?')[0].split('#')[0];
let USER = null, ROUTE = null, CFG = {}, REGS = [], LN = {}, DL = null, REDRAW = () => {}, MON = null, FUF = 'todo';

const DEF = {
  title: '線上說明會', site: '', cc: '60', tz: 'Asia/Kuala_Lumpur', slot_from: '0', slot_to: '23', media: '', vapid: '',
  fields: JSON.stringify([
    { key: 'name', label: '姓名', type: 'text', req: 1 },
    { key: 'phone', label: 'WhatsApp 電話', type: 'tel', req: 1 },
    { key: 'email', label: 'Email（Google 帳號）', type: 'email', req: 1 }]),
  mail_subj: '您的說明會觀看鏈接｜{title}',
  mail_body: '{name} 您好，\n\n感謝報名「{title}」！\n\n👉 立即觀看：{link}\n\n（此為您的專屬鏈接，請勿轉發）',
  book_subj: '預約成功｜{title}（{slot}）',
  book_body: '{name} 您好，\n\n您已成功預約「{title}」。\n預約時間：{slot}\n\n我們會在開始前 24 小時、1 小時及 5 分鐘以 email 提醒您，並附上專屬觀看鏈接。\n\n到時見！',
  remind_subj: '【{when}開始】{title}（{slot}）',
  remind_body: '{name} 您好，\n\n您預約的「{title}」將於{when}開始。\n預約時間：{slot}\n\n👉 專屬觀看鏈接：{link}\n\n（請勿轉發）',
  wa_welcome: '你好 {name}，我是{leader}，已收到你的報名！說明會觀看鏈接：{link}',
  wa_0: '你好 {name}，我是{leader}。看到你報名了說明會，但還沒開始看～有什麼我可以先幫你解答的嗎？鏈接：{link}',
  wa_1: '你好 {name}，我是{leader}。看到你已經看了一小段（{pct}%），想知道你目前的第一印象是什麼呢？可以隨時接著看：{link}',
  wa_2: '你好 {name}，我是{leader}。你已經看了{pct}%，有哪個部分你最有興趣或有疑問嗎？',
  wa_3: '你好 {name}，我是{leader}。看到你幾乎看完了說明會（{pct}%）！想聽聽你的想法，方便聊聊嗎？'
};
async function getCfg() {
  const d = await db.doc('config/main').get();
  return Object.assign({}, DEF, d.exists ? d.data() : {});
}

// ---------- 通用 ----------
const AUTHED = new Promise(r => auth.onAuthStateChanged(() => r()));
auth.onAuthStateChanged(u => { USER = u; if (ROUTE) ROUTE(u).catch(err); });
async function authPage(fn) { ROUTE = fn; await AUTHED; await fn(USER); }
const login = async () => {
  const pr = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(pr); }
  catch (e) { if (/popup|operation-not-supported/.test(e.code || '')) auth.signInWithRedirect(pr); else alert(e.message); }
};
const logout = () => { try { localStorage.removeItem('role'); } catch (e) {} auth.signOut().then(() => location.replace(base())); };
const err = e => view(shell(`<div class="card"><h3>出錯了</h3><p class="muted">${esc(e.message || e)}</p></div>`));
const thmLbl = () => document.documentElement.dataset.theme === 'dark' ? '☀️ 亮色' : '🌙 暗色';
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.theme = t; } catch (e) {}
  document.querySelectorAll('#thm').forEach(b => b.textContent = thmLbl());
}
const shell = (h, wide) => `<header class="top"><div><span class="brand"><i>◆</i>${esc(CFG.title)}</span><span class="actions"><button class="lnk" id="thm" onclick="toggleTheme()">${thmLbl()}</button>${USER ? '<button class="lnk" onclick="logout()">登出</button>' : ''}</span></div></header><main class="wrap${wide ? ' wide' : ''}">${h}</main><div class="foot">© ${esc(CFG.title)}</div>`;
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const fmt = ms => new Date(ms).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const tier = p => p >= 90 ? 3 : p >= 50 ? 2 : p > 0 ? 1 : 0;
const link = r => (CFG.site || base()) + '?w=' + r.token;
const fill = (t, r, ln) => String(t || '').replace(/{title}/g, CFG.title).replace(/{slot}/g, r.slot ? fmt(r.slot) : '')
  .replace(/{name}/g, r.name).replace(/{leader}/g, ln || '').replace(/{pct}/g, r.pct).replace(/{link}/g, link(r));
function wa(phone, txt) {
  let p = String(phone).replace(/\D/g, '');
  if (p[0] === '0') p = (CFG.cc || '60') + p.slice(1);
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(txt);
}

    let E, ended = false, started = false, tried = false, tick = 0; const t0 = Date.now();
    const beat = fin => {
      try {
        if (!fin && !E.playing()) return;
        const dur = Math.round(E.dur()), t = fin ? dur : E.time();

        events: {
          onReady: () => { E = { play: () => pl.playVideo(), time: () => pl.getCurrentTime(), dur: () => pl.getDuration(), playing: () => pl.getPlayerState() === 1, busy: () => [1, 3].includes(pl.getPlayerState()),
            seek: t => pl.seekTo(t, true), rate: () => pl.getPlaybackRate(), rate1: () => pl.setPlaybackRate(1),
            mute: () => pl.mute(), unmute: () => pl.unMute(), muted: () => pl.isMuted() }; E.play(); },

  set: [['video', 'YouTube 影片鏈接（建議設為「不公開」）'], ['media', '備用播放檔直連網址（mp4／mp3，選填。填了才支援手機鎖屏／後台繼續播放）'],
    ['vapid', '推播 VAPID 公鑰（Firebase → 專案設定 → Cloud Messaging → 網路推送憑證 → 產生金鑰對）'],
    ['site', '本網站完整網址（例：https://xxx.github.io/repo/）'], ['title', '說明會名稱'], ['cc', '電話國碼（馬來西亞=60）'],
    ['tz', '時區（email 提醒用，例：Asia/Kuala_Lumpur）'], ['slot_from', '可預約的起始整點（0–23）'], ['slot_to', '可預約的結束整點（0–23）']],
  txt: [['mail_subj', '【馬上觀看】Email 標題'], ['mail_body', '【馬上觀看】Email 內容（可用 {name} {title} {link}）', 1],
    ['book_subj', '【預約成功】Email 標題'], ['book_body', '【預約成功】Email 內容（可用 {name} {title} {slot}，不含鏈接）', 1],
    ['remind_subj', '【自動提醒】Email 標題（{when}＝24 小時後／1 小時後／5 分鐘後）'], ['remind_body', '【自動提醒】Email 內容（可用 {name} {title} {slot} {when} {link}）', 1],
    ['wa_welcome', 'WhatsApp：管理員通知文案', 1], ['wa_0', 'WhatsApp 跟進：完全沒看（0%）', 1], ['wa_1', 'WhatsApp 跟進：看了少部分（1–49%）', 1],
    ['wa_2', 'WhatsApp 跟進：看了一半以上（50–89%）', 1], ['wa_3', 'WhatsApp 跟進：幾乎看完（90%+）', 1]]
};
const TABS = [['set', '設定'], ['txt', '信件與文案'], ['fld', '報名欄位'], ['ldr', '發展者'], ['reg', '報名者']];
let S, F, T = 'reg';
const inp = ([k, l, ta]) => `<label>${l}</label>` + (ta ? `<textarea data-k="${k}">${esc(S.cfg[k])}</textarea>` : `<input data-k="${k}" value="${esc(S.cfg[k])}">`);
const saveBtn = '<button class="btn block" onclick="saveCfg()">💾 儲存</button>';
function grab() { document.querySelectorAll('[data-k]').forEach(i => S.cfg[i.dataset.k] = i.value); S.cfg.fields = JSON.stringify(F); }
const sw = k => { grab(); T = k; drawAdmin(); };
async function admin() {
  await authPage(async u => {
    if (!u) return loginCard('管理員', '請使用管理員的 Google 帳號登入。');
    if (u.email !== C.admin) return view(shell(`<div class="card"><h3>沒有權限</h3><p class="muted">${esc(u.email)} 不是管理員。</p></div>`));
    const [m, v, ls, rs, ws] = await Promise.all([getCfg(), db.doc('config/video').get(),
      db.collection('leaders').get(), db.collection('regs').get(), db.collection('watch').get()]);
    S = { cfg: Object.assign({}, m, { video: v.exists ? v.data().url : '' }), leaders: ls.docs.map(d => ({ id: d.id, ...d.data() })) };
    CFG = S.cfg; F = JSON.parse(CFG.fields); REGS = join(rs, ws);
    LN = {}; S.leaders.forEach(l => LN[l.code] = l.name);
    REDRAW = drawAdmin; try { localStorage.role = 'admin'; } catch (e) {}
    drawAdmin(); initPush('admin');
  });
}
function drawAdmin() {
  const site = esc(S.cfg.site || base());
  const body = {
    set: () => `<div class="card"><h3>基本設定</h3>${G.set.map(inp).join('')}${saveBtn}</div>`,
    txt: () => `<div class="card"><h3>信件與 WhatsApp 文案</h3>${G.txt.map(inp).join('')}${saveBtn}</div>`,
    fld: () => `<div class="card"><h3>報名欄位</h3><p class="muted">前三項（姓名／電話／Email）為必備，不可刪除。<br>欄位名｜類型｜必填｜下拉選項（逗號分隔）</p>` + F.map((f, i) => `<div class="fr">
      <input value="${esc(f.label)}" oninput="F[${i}].label=this.value">
      <select onchange="F[${i}].type=this.value">${['text', 'tel', 'email', 'select'].map(t => `<option ${f.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input type="checkbox" ${f.req ? 'checked' : ''} onchange="F[${i}].req=this.checked?1:0">
      <input value="${esc(f.options || '')}" oninput="F[${i}].options=this.value">
      ${i > 2 ? `<button class="btn ghost sm" onclick="grab();F.splice(${i},1);drawAdmin()">✕</button>` : '<span></span>'}</div>`).join('') +
      `<button class="btn ghost" onclick="grab();F.push({key:'f'+Date.now(),label:'',type:'text',req:0});drawAdmin()">＋ 新增欄位</button>${saveBtn}</div>`,
    ldr: () => `<div class="card"><h3>新增發展者（需用 Gmail 登入）</h3>
      <input id="le" placeholder="發展者的 Gmail" style="margin-bottom:8px"><input id="lc" placeholder="代碼（英文數字，成為報名鏈接的一部分）" style="margin-bottom:8px"><input id="ln" placeholder="姓名">
      <button class="btn block" onclick="addL()">新增發展者</button></div>` + S.leaders.map(l => `<div class="row"><b>${esc(l.name)}</b> <span class="tag">${esc(l.code)}</span><br>
      <small class="muted">${esc(l.id)}<br>報名鏈接：${site}?ref=${esc(l.code)}</small>
      <div class="btns"><button class="btn ghost sm" onclick="delL('${esc(l.id)}')">刪除</button></div></div>`).join('') +
      `<p class="muted center">發展者登入頁：${site}?dev</p>`,
    reg: () => pushCard('admin') + followPanel(1)
  }[T]();
  view(shell(`<div class="tabs">` + TABS.map(([k, n]) => `<button class="tab ${k === T ? 'on' : ''}" onclick="sw('${k}')">${n}</button>`).join('') + `</div>` + body, 1));
}
async function saveCfg() {
  grab(); const { video, ...rest } = S.cfg;
  try { await db.doc('config/main').set(rest); await db.doc('config/video').set({ url: video }); alert('已儲存'); }
  catch (e) { alert(e.message); }
}
async function addL() {
  grab(); const e = $('#le').value.trim().toLowerCase(), c = $('#lc').value.trim(), n = $('#ln').value.trim();
  if (!e || !c) return alert('Gmail 與代碼必填');
  if (S.leaders.some(l => l.code === c)) return alert('代碼已存在');
  try { await db.doc('leaders/' + e).set({ code: c, name: n }); S.leaders.push({ id: e, code: c, name: n }); LN[c] = n; drawAdmin(); }
  catch (x) { alert(x.message); }
}
async function delR(token) {
  const r = REGS.find(x => x.token === token); if (!r) return;
  if (!confirm(`⚠️ 第 1 次確認\n\n要刪除「${r.name}」的報名資料嗎？`)) return;
  if (!confirm(`⚠️ 第 2 次確認\n\n將永久刪除「${r.name}」（${r.email}）的報名資料與全部觀看紀錄，無法復原。\n\n確定要繼續嗎？`)) return;
  const t = prompt(`🛑 最後確認\n\n請輸入該報名者的姓名「${r.name}」以確認刪除：`);
  if (t === null) return;
  if (t.trim() !== String(r.name).trim()) return alert('輸入的姓名不符，已取消刪除');
  try {
    await db.doc('watch/' + token).delete(); await db.doc('regs/' + token).delete();
    REGS = REGS.filter(x => x.token !== token); drawAdmin(); alert('已刪除');
  } catch (e) { alert(e.message); }
}
async function delL(id) {
  if (!confirm('確定刪除 ' + id + '？')) return;
  grab(); await db.doc('leaders/' + id).delete(); S.leaders = S.leaders.filter(l => l.id !== id); drawAdmin();
}

// ---------- 第三步：發展者跟進 ----------
function drawDev() {
  const lk = (CFG.site || base()) + '?ref=' + DL.code;
  view(shell(`<section class="hero"><span class="pill">發展者後台</span><h1>${esc(DL.name)}</h1><p>你的專屬報名鏈接：</p>
    <p><b style="word-break:break-all">${esc(lk)}</b></p>
    <button class="btn gold sm" onclick="navigator.clipboard.writeText('${lk}');this.textContent='已複製 ✓'">複製鏈接</button></section>` + pushCard('leader') + followPanel(0), 1));
}
async function dev() {
  await authPage(async u => {
    if (!u) return loginCard('發展者', '請使用管理員為你登記的 Gmail 登入。');
    const ld = await db.doc('leaders/' + u.email.toLowerCase()).get();
    if (!ld.exists) return view(shell(`<div class="card"><h3>尚未獲得授權</h3><p class="muted">${esc(u.email)} 還不是發展者，請聯絡管理員加入。</p></div>`));
    DL = ld.data(); LN = { '': DL.name };
    const [rs, ws] = await Promise.all([db.collection('regs').where('leader', '==', DL.code).get(),
      db.collection('watch').where('leader', '==', DL.code).get()]);
    REGS = join(rs, ws); REDRAW = drawDev; try { localStorage.role = 'dev'; } catch (e) {}
    drawDev(); initPush('leader');
  });
}

// ---------- 路由 ----------
(async () => {
  try {
    if (!C.firebase.projectId) return view('<div class="wrap"><div class="card"><h3>尚未設定</h3><p>請先在 config.js 填入 Firebase 資料。</p></div></div>');
    CFG = await getCfg(); document.title = CFG.title;
    if (P.has('admin')) await admin();
    else if (P.has('dev')) await dev();
    else if (P.has('w')) await watch();
    else if (P.has('ref')) await register();
    else {
      let ro = ''; try { ro = localStorage.role || ''; } catch (e) {}
      if (ro) location.replace(base() + '?' + ro);
      else view(shell(`<section class="hero"><span class="pill">線上說明會</span><h1>${esc(CFG.title)}</h1><p>請使用邀請你的朋友提供的專屬鏈接報名。</p></section>`));
    }
  } catch (e) { err(e); }
})();
</script>
</body>
</html>
